name: Build SafeInstall APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        shell: bash
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.10/bin" >> "$GITHUB_PATH"

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SAFEINSTALL_KEYSTORE_BASE64 || secrets.ONAY_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "A signing keystore secret is required."; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/safeinstall-release.keystore"

      - name: Build signed release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SAFEINSTALL_KEYSTORE_PASSWORD || secrets.ONAY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SAFEINSTALL_KEY_ALIAS || secrets.ONAY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SAFEINSTALL_KEY_PASSWORD || secrets.ONAY_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD" || { echo "A keystore password secret is required."; exit 1; }
          test -n "$KEY_ALIAS" || { echo "A key alias secret is required."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "A key password secret is required."; exit 1; }
          gradle assembleRelease --stacktrace \
            -PappVersionCode="${{ github.run_number }}" \
            -PappVersionName="1.2.${{ github.run_number }}" \
            -PsigningStoreFile="$RUNNER_TEMP/safeinstall-release.keystore" \
            -PsigningStorePassword="$KEYSTORE_PASSWORD" \
            -PsigningKeyAlias="$KEY_ALIAS" \
            -PsigningKeyPassword="$KEY_PASSWORD"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeInstall-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Prepare release APK
        shell: bash
        run: cp app/build/outputs/apk/release/app-release.apk SafeInstall.apk

      - name: Publish APK release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: SafeInstall v1.2.${{ github.run_number }}
          prerelease: false
          files: SafeInstall.apk

