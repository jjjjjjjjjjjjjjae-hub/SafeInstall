plugins {
    id "com.android.application"
}

android {
    namespace "kz.safeinstall.app"
    compileSdk 35

    defaultConfig {
        applicationId "kz.safeinstall.app"
        minSdk 26
        targetSdk 35
        versionCode (project.findProperty("appVersionCode") ?: "3").toInteger()
        versionName (project.findProperty("appVersionName") ?: "1.2")
    }
}

dependencies {
    implementation "androidx.core:core:1.15.0"
}

