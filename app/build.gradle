plugins {
    id "com.android.application"
}

def buildVersionCode = (project.findProperty("appVersionCode") ?: "3").toString().toInteger()
def buildVersionName = (project.findProperty("appVersionName") ?: "1.2").toString()

android {
    namespace "kz.safeinstall.app"
    compileSdk 35

    defaultConfig {
        applicationId "kz.safeinstall.app"
        minSdk 26
        targetSdk 35
        versionCode buildVersionCode
        versionName buildVersionName
    }
}

dependencies {
    implementation "androidx.core:core:1.15.0"
}

