plugins {
    id "com.android.application"
}

def buildVersionCode = (project.findProperty("appVersionCode") ?: "3").toString().toInteger()
def buildVersionName = (project.findProperty("appVersionName") ?: "1.2").toString()
def hasReleaseSigning = project.hasProperty("signingStoreFile")

android {
    namespace "kz.safeinstall.app"
    compileSdk 35

    defaultConfig {
        applicationId "kz.safeinstall.app"
        minSdk 26
        targetSdk 35
        versionCode buildVersionCode
        versionName buildVersionName
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(project.property("signingStoreFile"))
                storePassword project.property("signingStorePassword")
                keyAlias project.property("signingKeyAlias")
                keyPassword project.property("signingKeyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.15.0"
}

